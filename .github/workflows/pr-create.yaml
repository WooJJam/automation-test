name: Create PR

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Collect Data
        run: |
          echo "📊 Collecting git data..."

          git log origin/main..HEAD --pretty=format:"- %s" > /tmp/commits.txt
          echo "✅ Commits: $(wc -l < /tmp/commits.txt) commits"

          git diff --name-status origin/main...HEAD > /tmp/files.txt
          echo "✅ Files: $(wc -l < /tmp/files.txt) files changed"

          git diff origin/main...HEAD > /tmp/diff.txt
          DIFF_SIZE=$(wc -c < /tmp/diff.txt)
          echo "✅ Diff: $DIFF_SIZE bytes"

          git diff --shortstat origin/main...HEAD > /tmp/stats.txt
          echo "✅ Stats: $(cat /tmp/stats.txt)"

          echo ""
          echo "📁 Changed files:"
          cat /tmp/files.txt

      - name: Generate PR
        id: ai
        uses: ./.github/actions/generate-pr
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ inputs.branch_name }}" \
            --title "${{ steps.ai.outputs.title }}" \
            --body "${{ steps.ai.outputs.body }}" \
            --assignee ${{ github.actor }} \
            --draft

          PR_NUM=$(gh pr view "${{ inputs.branch_name }}" --json number -q .number)
          echo "✅ Draft PR #$PR_NUM created"
          echo "💡 Mark as 'Ready for review' when ready"
