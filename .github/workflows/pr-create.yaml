name: Create PR

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Collect Data
        run: |
          git log origin/develop..HEAD --pretty=format:"- %s" > /tmp/commits.txt
          git diff --name-status origin/develop...HEAD > /tmp/files.txt
          git diff origin/develop...HEAD > /tmp/diff.txt
          git diff --shortstat origin/develop...HEAD > /tmp/stats.txt

      - name: Generate PR
        id: ai
        uses: ./.github/actions/generate-pr
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ inputs.branch_name }}" \
            --title "${{ steps.ai.outputs.title }}" \
            --body "${{ steps.ai.outputs.body }}" \
            --assignee ${{ github.actor }} \
            --draft

          PR_NUM=$(gh pr view "${{ inputs.branch_name }}" --json number -q .number)
          echo "✅ Draft PR #$PR_NUM created"
          echo "💡 Mark as 'Ready for review' when ready"
