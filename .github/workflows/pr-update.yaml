name: Update PR

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      branch_name:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Check PR Status
        id: check
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          IS_DRAFT=$(gh pr view "${{ inputs.pr_number }}" --json isDraft -q .isDraft)

          if [ "$IS_DRAFT" = "false" ]; then
            echo "⏭️  PR is ready for review - skipping auto-update"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ PR is draft - proceeding with update"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect Data
        if: steps.check.outputs.skip == 'false'
        run: |
          git log origin/main..HEAD --pretty=format:"- %s" > /tmp/commits.txt
          git diff --name-status origin/main...HEAD > /tmp/files.txt
          git diff origin/main...HEAD > /tmp/diff.txt
          git diff --shortstat origin/main...HEAD > /tmp/stats.txt

      - name: Generate PR
        if: steps.check.outputs.skip == 'false'
        id: ai
        uses: ./.github/actions/generate-pr
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Update PR
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr edit "${{ inputs.pr_number }}" \
            --title "${{ steps.ai.outputs.title }}" \
            --body "${{ steps.ai.outputs.body }}"

          echo "✅ Draft PR #${{ inputs.pr_number }} updated"
          echo "💡 Mark as 'Ready for review' when ready"
