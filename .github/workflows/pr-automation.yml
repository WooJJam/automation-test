name: PR Automation

on:
  pull_request:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to regenerate'
        required: true
        type: string

jobs:
  generate-pr:
    name: Generate PR with AI
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'ai-generated') || github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Get PR Info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

          echo "================================================"
          echo "🤖 AI PR Generation"
          echo "================================================"
          echo "PR Number: #$PR_NUMBER"
          echo "Branch: $BRANCH"
          echo "================================================"

      - name: Collect Data
        run: |
          echo "📊 Collecting git data..."

          git log origin/main..HEAD --pretty=format:"- %s" > /tmp/commits.txt
          echo "✅ Commits: $(wc -l < /tmp/commits.txt) commits"

          git diff --name-status origin/main...HEAD > /tmp/files.txt
          echo "✅ Files: $(wc -l < /tmp/files.txt) files changed"

          git diff origin/main...HEAD > /tmp/diff.txt
          DIFF_SIZE=$(wc -c < /tmp/diff.txt)
          echo "✅ Diff: $DIFF_SIZE bytes"

          git diff --shortstat origin/main...HEAD > /tmp/stats.txt
          echo "✅ Stats: $(cat /tmp/stats.txt)"

          echo ""
          echo "📁 Changed files:"
          cat /tmp/files.txt

      - name: Generate PR
        id: ai
        uses: ./.github/actions/generate-pr
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Update PR
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr edit "${{ steps.pr.outputs.pr_number }}" \
            --title "${{ steps.ai.outputs.title }}" \
            --body "${{ steps.ai.outputs.body }}"

          echo "✅ PR #${{ steps.pr.outputs.pr_number }} generated with AI"
          echo "💡 Remove 'ai-generated' label to prevent auto-regeneration"
