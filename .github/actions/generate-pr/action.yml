name: Generate PR with AI
description: Generate PR title and body using OpenAI GPT (Responses API)

inputs:
  openai_api_key:
    required: true
  stats_file:
    required: false
    default: '/tmp/stats.txt'
  files_file:
    required: false
    default: '/tmp/files.txt'
  diff_file:
    required: false
    default: '/tmp/diff.txt'

outputs:
  title:
    value: ${{ steps.gen.outputs.title }}
  body:
    value: ${{ steps.gen.outputs.body }}

runs:
  using: composite
  steps:
    - name: Generate
      id: gen
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
      run: |
        set -euo pipefail

        # -------- Prompt --------
        cat > /tmp/prompt.txt << 'EOF'
        You are an expert software engineer writing a professional Pull Request in Korean.

        IMPORTANT: Analyze ALL changes in the diff comprehensively. Pay special attention to newly added files and major architectural changes.

        Return ONLY a valid JSON object. Do not include any extra text, markdown fences, or explanations outside JSON.

        JSON structure (exact keys):
        {
          "title": "PR 제목 (50자 이내)",
          "body": "PR 본문 (마크다운 형식)"
        }

        PR 제목 규칙:
        - 50자 이내
        - 명령형
        - 가장 중요한 변경사항 요약

        PR 본문 규칙:
        - 아래 구조를 따르되 변경된 파일 목록과 Diff를 분석해 작성
        - 섹션별로 핵심만, 과도한 장문은 피함

        > 🤖 **이 PR은 OpenAI API를 사용하여 자동 생성되었습니다.**

        ## 📝 요약
        - 핵심 1-2문장
        - 배경/목적 간단히

        ## ✅ 주요 변경 사항
        - 기능/모듈 단위로
        - Why / Impact 포함

        ## 💻 상세 구현 내용
        - 아키텍처/흐름/핵심 컴포넌트
        - 중요한 함수/클래스 역할
        - 필요 시 짧은 코드 스니펫(최소)

        ## 🔧 트러블 슈팅
        - 없으면: "특별한 트러블슈팅 사항이 없습니다."

        ## 📌 리뷰 포인트
        - 있으면 작성, 없으면 생략

        분석 우선순위:
        1) Stats 2) Files(신규 파일 우선) 3) Diff

        --- Stats ---
        EOF
        cat "${{ inputs.stats_file }}" >> /tmp/prompt.txt
        cat >> /tmp/prompt.txt << 'EOF'

        --- Files ---
        EOF
        cat "${{ inputs.files_file }}" >> /tmp/prompt.txt
        cat >> /tmp/prompt.txt << 'EOF'

        --- Diff ---
        EOF
        cat "${{ inputs.diff_file }}" >> /tmp/prompt.txt

        PROMPT="$(cat /tmp/prompt.txt)"
        PROMPT_SIZE="$(printf "%s" "$PROMPT" | wc -c | tr -d ' ')"
        echo "📝 Prompt size: $PROMPT_SIZE characters"

        # -------- OpenAI Call (Responses API) --------
        # Notes:
        # - Use /v1/responses for better structured output stability on newer models.
        # - Lower temperature improves JSON stability.
        # - max_output_tokens limits OUTPUT (not input).
        #
        # If your environment supports JSON schema, you can upgrade "text.format" later.
        #
        for i in {1..3}; do
          echo "🔄 OpenAI API 호출 시도 $i/3"

          RESPONSE="$(curl -sS https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-5-mini\",
              \"input\": [
                {\"role\": \"system\", \"content\": \"You generate PR titles and bodies in JSON only. Return ONLY JSON.\"},
                {\"role\": \"user\", \"content\": $(printf "%s" "$PROMPT" | jq -Rs .)}
              ],
              \"text\": {\"format\": {\"type\": \"json_object\"}},
              \"temperature\": 0.3,
              \"max_output_tokens\": 1200
            }")"

          # 에러 체크 (Responses API 에러 형태 대응)
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "❌ API Error:"
            echo "$RESPONSE" | jq '.error'
            [ $i -lt 3 ] && sleep $((i * 2))
            continue
          fi

          # 응답에서 텍스트 추출 (Responses API)
          # 일반적으로 output[0].content[0].text에 들어오며, 없을 경우를 대비해 fallback을 둠.
          TEXT="$(echo "$RESPONSE" | jq -r '
            (
              .output[0].content[0].text //
              .output[0].content[0].content //
              .output_text //
              empty
            )')"

          if [ -z "$TEXT" ]; then
            echo "⚠️  TEXT 추출 실패 - RAW RESPONSE 일부 출력"
            echo "$RESPONSE" | jq '.' | head -c 4000 || true
            [ $i -lt 3 ] && sleep $((i * 2))
            continue
          fi

          # JSON 유효성 검사
          if ! echo "$TEXT" | jq -e . >/dev/null 2>&1; then
            echo "⚠️  JSON 파싱 실패 - RAW TEXT 출력(최대 4000자)"
            echo "---- RAW TEXT BEGIN ----"
            echo "$TEXT" | head -c 4000
            echo
            echo "---- RAW TEXT END ----"
            [ $i -lt 3 ] && sleep $((i * 2))
            continue
          fi

          TITLE="$(echo "$TEXT" | jq -r '.title // empty')"
          BODY="$(echo "$TEXT"  | jq -r '.body  // empty')"

          if [ -n "$TITLE" ] && [ -n "$BODY" ]; then
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "✅ PR 생성 완료"
            exit 0
          fi

          echo "⚠️  title/body 누락 - 재시도"
          echo "---- RAW JSON BEGIN ----"
          echo "$TEXT" | head -c 4000
          echo
          echo "---- RAW JSON END ----"
          [ $i -lt 3 ] && sleep $((i * 2))
        done

        echo "❌ OpenAI API 호출/파싱 최종 실패"
        echo "Response(일부):"
        echo "$RESPONSE" | jq '.' | head -c 4000 || true
        exit 1
