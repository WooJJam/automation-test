name: Generate PR with AI
description: Generate PR title and body using OpenAI GPT

inputs:
  openai_api_key:
    required: true

outputs:
  title:
    value: ${{ steps.gen.outputs.title }}
  body:
    value: ${{ steps.gen.outputs.body }}

runs:
  using: composite
  steps:
    - name: Generate
      id: gen
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
      run: |
        # 프롬프트 생성
        cat > /tmp/prompt.txt << 'EOF'
        You are an expert software engineer writing a professional Pull Request in Korean.

        IMPORTANT: Analyze ALL changes in the diff comprehensively. Don't focus only on recent commits.
        Pay special attention to newly added files and major architectural changes.

        Generate a JSON response with this exact structure:
        {
          "title": "PR 제목 (50자 이내)",
          "body": "PR 본문 (마크다운 형식)"
        }

        PR 제목 작성 규칙:
        - 50자 이내
        - 명령형 사용
        - 가장 중요한 변경사항 요약
        - 예: "Spring Boot 프로젝트 초기 설정 및 PR 자동화 워크플로우 추가"

        PR 본문 작성 규칙:
        반드시 아래 구조를 따르되, 변경된 파일 목록과 Diff를 모두 분석하여 작성하세요.

        > 🤖 **이 PR은 OpenAI GPT-4o-mini를 사용하여 자동 생성되었습니다.**

        ## 📝 요약
        - 전체 변경사항의 핵심을 1-2문장으로 요약

        ## ✅ 주요 변경 사항
        - 큰 기능/모듈 단위로 변경사항 나열
        - 파일별 나열이 아닌 기능 중심으로 요약 (예: "Spring Boot 프로젝트 초기 설정", "GitHub Actions PR 자동화 워크플로우")
        - 각 기능의 목적과 효과 설명

        ## 💻 상세 구현 내용
        - 아키텍처 및 구조 설계 방식
        - 주요 컴포넌트 간 상호작용 방식 및 데이터 흐름
        - 사용된 기술 스택, 라이브러리, 프레임워크, 디자인 패턴
        - 핵심 로직이나 알고리즘
        - 설정 파일의 주요 내용 (환경변수, secrets, permissions 등)
        - 파일 구조 및 모듈 분리 전략
        - 주요 함수/클래스의 역할

        ## 🚀 트러블 슈팅
        - 문제 해결 내용이 있으면 작성 (없으면 "특별한 트러블슈팅 사항이 없습니다.")

        ## ⚠️ 알려진 이슈
        - 알려진 문제나 TODO가 있으면 작성 (없으면 "알려진 이슈가 없습니다.")

        분석 우선순위:
        1. Stats로 변경 규모 파악
        2. Files로 어떤 파일들이 변경되었는지 확인 (특히 새로 추가된 파일 주목)
        3. Diff로 실제 코드 변경 내용 분석
        4. Commits는 맥락 파악용으로만 참고

        --- Stats ---
        EOF
        cat /tmp/stats.txt >> /tmp/prompt.txt
        cat >> /tmp/prompt.txt << 'EOF'

        --- Files ---
        EOF
        cat /tmp/files.txt >> /tmp/prompt.txt
        cat >> /tmp/prompt.txt << 'EOF'

        --- Commits ---
        EOF
        cat /tmp/commits.txt >> /tmp/prompt.txt
        cat >> /tmp/prompt.txt << 'EOF'

        --- Diff ---
        EOF
        cat /tmp/diff.txt >> /tmp/prompt.txt

        PROMPT=$(cat /tmp/prompt.txt)
        PROMPT_SIZE=$(echo "$PROMPT" | wc -c)
        echo "📝 Prompt size: $PROMPT_SIZE characters"

        for i in {1..3}; do
          echo "🔄 OpenAI API 호출 시도 $i/3"

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a helpful assistant that generates PR titles and bodies in JSON format.\"},
                {\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}
              ],
              \"response_format\": {\"type\": \"json_object\"},
              \"temperature\": 0.7,
              \"max_tokens\": 2048
            }")

          # 에러 체크
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ API Error:"
            echo "$RESPONSE" | jq '.error'
            [ $i -lt 3 ] && sleep $((i * 2))
            continue
          fi

          # JSON 파싱
          TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' 2>/dev/null)
          TITLE=$(echo "$TEXT" | jq -r '.title' 2>/dev/null)
          BODY=$(echo "$TEXT" | jq -r '.body' 2>/dev/null)

          if [ -n "$TITLE" ] && [ -n "$BODY" ]; then
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "---" >> $GITHUB_OUTPUT
            echo "<!-- Auto-generated by OpenAI GPT-4o-mini -->" >> $GITHUB_OUTPUT
            echo "<!-- Last-Generated-From: $GITHUB_SHA -->" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ PR 생성 완료"
            break
          fi

          echo "⚠️  파싱 실패 - 재시도"
          [ $i -lt 3 ] && sleep $((i * 2))
        done

        # API 호출 실패 처리
        if [ ! -f "$GITHUB_OUTPUT" ] || ! grep -q "^title=" "$GITHUB_OUTPUT"; then
          echo "❌ OpenAI API 호출 실패"
          echo "Response: $RESPONSE"
          exit 1
        fi
