name: Generate PR with AI
description: Generate PR title and body using Gemini AI

inputs:
  gemini_api_key:
    required: true

outputs:
  title:
    value: ${{ steps.gen.outputs.title }}
  body:
    value: ${{ steps.gen.outputs.body }}

runs:
  using: composite
  steps:
    - name: Generate
      id: gen
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
      run: |
        # ===== TEST MODE: AI API 호출 비활성화 =====
        # API 호출 대신 테스트 값 사용

        # # AI API 호출 (주석 처리됨)
         {
           echo 'Generate JSON: {"title": "제목", "body": "본문"}'
           echo '--- Stats ---'
           cat /tmp/stats.txt
           echo '--- Files ---'
           cat /tmp/files.txt
           echo '--- Commits ---'
           cat /tmp/commits.txt
           echo '--- Diff ---'
           cat /tmp/diff.txt
         } > /tmp/prompt.txt

         for i in {1..3}; do
           PROMPT_JSON=$(jq -Rs . /tmp/prompt.txt)
           RESPONSE=$(curl -sf -X POST \
             "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=$GEMINI_API_KEY" \
             -H "Content-Type: application/json" \
             -d "{\"contents\":[{\"parts\":[{\"text\":$PROMPT_JSON}]}],\"generationConfig\":{\"temperature\":0.7,\"maxOutputTokens\":2048}}")

           TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null | sed 's/```json//g;s/```//g')
           TITLE=$(echo "$TEXT" | jq -r '.title' 2>/dev/null)
           BODY=$(echo "$TEXT" | jq -r '.body' 2>/dev/null)

           if [ -n "$TITLE" ] && [ -n "$BODY" ]; then
             echo "title=$TITLE" >> $GITHUB_OUTPUT
             echo "body<<EOF" >> $GITHUB_OUTPUT
             echo "$BODY" >> $GITHUB_OUTPUT
             echo "" >> $GITHUB_OUTPUT
             echo "<!-- Last-Generated-From: $GITHUB_SHA -->" >> $GITHUB_OUTPUT
             echo "EOF" >> $GITHUB_OUTPUT
             break
           fi

           [ $i -lt 3 ] && sleep $((i * 2))
         done

#        # ===== 테스트 값으로 대체 =====
#        echo "🧪 TEST MODE: Using hardcoded test values"
#
#        TITLE="[TEST] PR 자동화 워크플로우 테스트"
#        BODY="## 📝 요약 (Summary)
#
#        이것은 PR 자동화 워크플로우 테스트입니다.
#
#        ## ✅ 주요 변경 사항 (Key Changes)
#
#        - GitHub Actions 워크플로우 설정
#        - Draft PR 자동 생성 기능
#        - AI PR 생성 (현재 테스트 모드)
#
#        ## 💻 상세 구현 내용 (Implementation Details)
#
#        Draft PR로 생성되어 추가 커밋 시 자동 업데이트됩니다.
#        Ready for review 상태로 변경하면 자동 업데이트가 중지됩니다.
#
#        ## 🚀 트러블 슈팅 (Trouble Shooting)
#
#        특별한 이슈가 없습니다.
#
#        ## ⚠️ 알려진 이슈 및 참고 사항 (Known Issues & Notes)
#
#        현재 AI API는 비활성화되어 테스트 값을 사용 중입니다."

        # Output 설정
        echo "title=$TITLE" >> $GITHUB_OUTPUT
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "---" >> $GITHUB_OUTPUT
        echo "<!-- Auto-generated (TEST MODE) -->" >> $GITHUB_OUTPUT
        echo "<!-- Last-Generated-From: $GITHUB_SHA -->" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "✅ Test values generated successfully"
